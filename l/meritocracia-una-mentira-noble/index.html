<script>try{sessionStorage.setItem("vl-item-meritocracia-una-mentira-noble","{\"id\":\"95f7ef8aokyu\",\"slug\":\"meritocracia-una-mentira-noble\",\"fecha\":\"2026-10-14\",\"categoria\":\"youtube\",\"titulo\":\"Meritocracia: ¿una mentira noble?\",\"bajada\":\"¿El esfuerzo basta para salir adelante? Durante tres décadas Chile prometió que la educación sería el ascensor social y que el esfuerzo alcanzaría para subir.\",\"enlace\":\"https://www.youtube.com/watch?v=MX6Ym-izYeQ\",\"imagen\":\"https://lh3.googleusercontent.com/d/1IIzrnOvO-MgOasCCdJXHMxxHBAYlob64\",\"destacado\":false,\"tieneTexto\":true,\"compartir\":\"\",\"medio\":\"\",\"autores\":\"\",\"referencia\":\"\",\"texto\":\"En este video de Vox Liber revisamos qué promete la meritocracia, qué cumple y a quién le sirve que sigamos creyendo en ella.\\n\\nLa portada lo resume: un hombre de traje cayendo entre nubes. Cuando alguien cae, la explicación ya está lista: no se esforzó lo suficiente. Rara vez preguntamos quién tenía paracaídas antes de saltar.\\n\\nEn este video revisamos:\\n▸ La diferencia entre mérito y meritocracia, y por qué casi toda la confusión pública viene de mezclarlos.\\n▸ El mito de los metales de Platón y la sátira de Michael Young, que inventó la palabra meritocracia en 1958 como advertencia y no como programa.\\n▸ Lo que dicen los datos: según la OCDE, a un niño nacido en el decil más pobre le tomaría entre cuatro y cinco generaciones llegar al ingreso medio de su país.\\n▸ El caso chileno: más títulos que nunca, pero posiciones sociales que cambian poco.\\n▸ Sandel, Markovits y la tiranía del mérito: soberbia arriba, humillación abajo y agotamiento en todas partes.\\n▸ La posición de Carlos Peña en «La mentira noble»: el mérito contra la meritocracia, las desigualdades merecidas contra las inmerecidas.\\n▸ Alternativas: corregir la partida antes que la llegada, repensar la admisión y nombrar la suerte cuando corresponde.\\n\\nEl esfuerzo importa, pero no basta.\"}")}catch(e){}location.replace("../../?leer=meritocracia-una-mentira-noble");</script>
