<main><small>Vox Liber · Columnas de opinión</small><h1>El desempleo de acuerdo a distintas escuelas económicas</h1><p>Neoclásicos, keynesianos, marxistas y austriacos coinciden en que el empleo es central para la economía, pero discrepan profundamente sobre por qué existe el desempleo y qué hacer con él.</p><a href="../../?leer=el-desempleo-de-acuerdo-a-distintas-escuelas-economicas">Leer en Vox Liber</a></main>
