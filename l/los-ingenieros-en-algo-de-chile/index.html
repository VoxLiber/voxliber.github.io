<script>try{sessionStorage.setItem("vl-item-los-ingenieros-en-algo-de-chile","{\"id\":\"ef7506928htp\",\"slug\":\"los-ingenieros-en-algo-de-chile\",\"fecha\":\"2026-10-09\",\"categoria\":\"youtube\",\"titulo\":\"Los \\\"Ingenieros en Algo\\\" de Chile\",\"bajada\":\"LOS INGENIEROS EN ALGO DE CHILE | ¿Prestigio profesional o argumento de ventas?\",\"enlace\":\"https://www.youtube.com/watch?v=66OnDdB3DPk\",\"imagen\":\"https://lh3.googleusercontent.com/d/1GQhkZ_Jg01POu8dgEiDk-e5anY9kGPLA\",\"destacado\":true,\"tieneTexto\":true,\"compartir\":\"\",\"medio\":\"\",\"autores\":\"\",\"referencia\":\"\",\"texto\":\"En Chile, la palabra ingeniería aparece en carreras tan diversas como marketing, turismo, recursos humanos, logística y administración. Pero ¿qué significa realmente ser ingeniero? ¿Todas estas carreras ofrecen la misma formación, reconocimiento profesional y proyección laboral?\\n\\nEn este nuevo análisis de **Vox Liber**, examinamos el fenómeno de las llamadas «ingenierías en algo»: sus antecedentes históricos, el impacto de la reforma educacional de 1981, el rol del Colegio de Ingenieros de Chile y las consecuencias que puede tener la denominación de una carrera para quienes invierten años de estudio y recursos económicos en su formación.\\n\\n🔎 *En este video abordamos:*\\n\\n¿Cómo se expandió el uso de la palabra «ingeniería» en Chile?\\n¿Qué diferencias existen entre las distintas formaciones profesionales?\\n¿Qué títulos reconoce el Colegio de Ingenieros de Chile?\\n¿Qué información debería verificar un estudiante antes de matricularse?\\n¿Dónde termina la denominación académica y comienza la responsabilidad de informar con claridad?\\n\\nNo se trata de desvalorizar a quienes estudian o ejercen en áreas como turismo, marketing, logística o administración. Se trata de abrir una discusión necesaria sobre los títulos, las competencias, las expectativas laborales y la información que reciben los futuros estudiantes.\"}")}catch(e){}location.replace("../../?leer
