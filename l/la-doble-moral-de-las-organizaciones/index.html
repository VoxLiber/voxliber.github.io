<script>try{sessionStorage.setItem("vl-item-la-doble-moral-de-las-organizaciones","{\"id\":\"0dfb84bam7v0\",\"slug\":\"la-doble-moral-de-las-organizaciones\",\"fecha\":\"2026-10-13\",\"categoria\":\"youtube\",\"titulo\":\"La Doble Moral de las Organizaciones\",\"bajada\":\"¿Por qué las organizaciones con más códigos de ética, protocolos y reportes de sostenibilidad siguen produciendo escándalos?\",\"enlace\":\"https://www.youtube.com/watch?v=E6XKMst_h3U\",\"imagen\":\"https://lh3.googleusercontent.com/d/1Nqhi7MySDWJ481q3U8P_4vuE6iMubsQ1\",\"destacado\":false,\"tieneTexto\":true,\"compartir\":\"\",\"medio\":\"\",\"autores\":\"\",\"referencia\":\"\",\"texto\":\"En este video de Vox Liber analizamos la doble moral de las organizaciones: la distancia, casi siempre silenciosa y casi siempre rentable, entre lo que declaran y lo que efectivamente hacen.\\n\\nPor sus frutos los conoceréis. No por su misión, ni por el código de ética enmarcado en el hall, ni por el reporte impreso en papel reciclado.\\n\\nEn este video revisamos:\\n▸ Qué es la doble moral organizacional y por qué no es solo un problema de las grandes empresas, sino también de colegios, hospitales, universidades, partidos, iglesias y servicios públicos.\\n▸ La fachada institucional (Meyer y Rowan), la hipocresía organizada (Brunsson) y los sistemas perversos de Jorge Etkin.\\n▸ Cómo personas decentes sostienen sistemas incoherentes: desconexión moral, eufemismos, silencio organizacional y distancia cínica.\\n▸ La industria del cumplimiento en Chile: la Ley 21.595 de delitos económicos y el primer año de la Ley Karin.\\n▸ Las nuevas fronteras: bienestar de vitrina, lavado verde, privacidad de datos, ética de la inteligencia artificial y la propia universidad.\\n▸ Alternativas concretas: auditar la brecha y no el discurso, y rediseñar los incentivos antes que los valores.\\n\\nUna organización no se define por lo que declara, sino por lo que efectivamente premia.\"}")}catch(e){}location.replace("../../?leer=la-
