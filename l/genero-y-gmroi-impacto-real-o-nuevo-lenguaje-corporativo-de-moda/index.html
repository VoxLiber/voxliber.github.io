<script>try{sessionStorage.setItem("vl-item-genero-y-gmroi-impacto-real-o-nuevo-lenguaje-corporativo-de-moda","{\"id\":\"63e3e52dt5ey\",\"slug\":\"genero-y-gmroi-impacto-real-o-nuevo-lenguaje-corporativo-de-moda\",\"fecha\":\"2026-06-12\",\"categoria\":\"columnas\",\"titulo\":\"Género y GMROI; ¿impacto real o nuevo lenguaje corporativo de moda?\",\"bajada\":\"Uno de los conceptos más difundidos durante el último tiempo por parte de las Empresas, entidades gubernamentales y no gubernamentales, es el referido a las políticas de género.\",\"enlace\":\"https://www.diarioelheraldo.cl/noticia/genero-y-gmroi-impacto-real-o-nuevo-lenguaje-corporativo-de-moda\",\"imagen\":\"https://lh3.googleusercontent.com/d/1H_E_EGzRyWDJXHg3uqEoVyIK4u8AukD7\",\"destacado\":false,\"tieneTexto\":true,\"compartir\":\"\",\"medio\":\"\",\"autores\":\"\",\"referencia\":\"\",\"texto\":\"Por: Luis Leyton Johns.\\n\\nUno de los conceptos más difundidos durante el último tiempo por parte de las Empresas, entidades gubernamentales y no gubernamentales, es el referido a las políticas de género. En este pequeño escrito trataremos de instalar la pregunta que titula esta nota para que nos llame a la reflexión: “igualdad de género y GMROI: ¿impacto real o nuevo lenguaje corporativo de moda?. \\n\\nPara lo anterior revisaremos una interesante teoría y veremos algunas de las evidencias científicas que nos han entregado sendos estudios durante el último tiempo. Debo prevenirles que nuestra finalidad no es obtener una conclusión, sino más bien, un llamado a la reflexión que permita tomar mejores decisiones que aporten a que las organizaciones a las que pertenecemos se mantengan en el tiempo y recordar lo que Steven Pinker alguna vez nos dijo en una de sus Ted Talks: “hay una diferencia entre lo que la ciencia dice y los negocios hacen”. Vamos!!!\\n\\nEn 1991, el sociólogo y profesor de la Columbia Business School, Eric Abrahamson acuñó el concepto que denominó “Management Fashions” (Modas Gerenciales), en su artículo de 1991 \\\"Managerial Fads and Fashions: The Diffusion and Rejection of Innovations\\\", publicado en la revista Academy of Management Review, posteriormente desarrolló la “Management Fashion Theory”, que básicamente indicaba que las modas gerenciales son creencias momentáneas, difundidas por los \\\"proveedores de moda\\\" (consultoras, gurús, escuelas de negocios y medios), y que pretenden posicionar a una técnica de gestión como innovadora y racionalmente progresiva para los objetivos de una empresa. \\n\\nSegún este modelo, las modas gerenciales siguen un ciclo similar al de las modas culturales y seguirían las siguientes fases: (i) innovación académica, (ii) promoción consultora, (iii) adopción corporativa masiva, (iv) desilusión parcial e (v) integración parcial. \\t\\n\\nA lo largo de la historia de la administración (haciendo una búsqueda superficial),  podríamos nombrar a lo menos 20 “modas gerenciales” que resultaron ser  influyentes a través del tiempo, estas van desde la “administración científica” de Taylor de 1911, hasta la actual “IA en management” difundida por la industria tecnológica en nuestro presente. El paradigma de la “diversidad e inclusión” surge en la década de los 90s del siglo pasado, de la mano de Roosvelt Thomas y hoy, más de 30 años más tarde podríamos decir que está en la etapa (iii) del ciclo que proponía el Profesor Abrahamson. \\n\\nSiguiendo con la idea del ciclo y sus fases, ya sabemos quién hizo la (i) innovación académica y que en teoría estamos en la etapa (iii) de adopción corporativa masiva, pero ¿qué pasa con la etapa (ii) de promoción consultora?. Durante la última década, el llamado \\\"business case for diversity\\\" fue elevado casi a dogma corporativo. Su principal argumento fue una serie de estudios de McKinsey & Company publicados en los años 2015, 2018, 2020 y 2023 bajo los títulos \\\"Diversity Matters\\\", \\\"Delivering Through Diversity\\\" y \\\"Diversity Wins\\\", que afirmaban correlaciones sistemáticas entre una mayor representación femenina en equipos directivos y un mejor desempeño financiero. El último de estos informes (2023) sostuvo que las empresas en el cuartil superior de diversidad de género en sus directorios eran unos 27% más propensas a superar financieramente a sus pares en el cuartil inferior. Esta cifra fue ampliamente citada por instituciones financieras, reguladores y grandes corporaciones para justificar políticas de contratación con criterios de género. En tanto, el Fondo Monetario Internacional, el Banco Mundial y decenas de empresas del S&P 500 incorporaron estas conclusiones a sus marcos de gobierno corporativo. Aquí estaría el surgimiento de lo que llamaremos el “argumento oficial” que nos promete que la diversidad mejora el rendimiento.\\n\\nAhora bien, lo que este discurso corporativo omite es que los estudios de McKinsey no son investigación académica revisada por pares. Son informes de consultoría con metodologías muchas veces opacas, y cuando investigadores independientes intentaron replicar sus resultados, los hallazgos fueron a lo menos “desconcertantes”, por ejemplo; en 2024, los economistas Jeremiah Green y John Hand publicaron en Econ Journal Watch un análisis exhaustivo de los cuatro estudios de McKinsey sobre diversidad. Su conclusión fue lapidaria: los resultados no son replicables. Más aún, identificaron un error metodológico de fondo: McKinsey midió la diversidad ejecutiva después del periodo de desempeño financiero evaluado, no antes. En otras palabras, la causalidad podría estar completamente invertida: las empresas más rentables son las que pueden darse el lujo de adoptar políticas de diversidad, no al revés. Por otra parte, el profesor de finanzas de la London Business School, Alex Edmans, revisó la literatura académica revisada por pares sobre el tema y llegó a una conclusión igualmente desconcertante: los estudios rigurosos no encuentran que la diversidad de género en el directorio mejore el rendimiento financiero. Más aún, señaló que el estudio de McKinsey \\\"no encontró ningún vínculo entre diversidad y otras métricas de desempeño; margen bruto, retorno sobre activos, retorno sobre patrimonio, crecimiento de ventas o retorno total para el accionista, cuando se utilizan metodologías más establecidas\\\". Por su parte, la profesora Katherine Klein de Wharton, en su revisión de dos metaanálisis sobre diversidad de género en directorios, concluyó que la relación con el desempeño corporativo es \\\"efectivamente cero o muy débilmente positiva\\\". Incluso Ely y Thomas de Harvard Business School sostuvieron en Harvard Business Review (2020) que \\\"los investigadores rara vez han encontrado que una mayor diversidad conduzca a mejores resultados financieros\\\".\\n\\nLo anterior no significa que la diversidad nunca tenga impacto. La investigación más matizada sugiere que los efectos dependen fuertemente del nivel organizacional, el sector y el contexto cultural. Un estudio publicado en 2022 con datos de 159 grandes empresas francesas encontró que la diversidad de género a nivel de mandos medios y personal operativo, no en el directorio, sí tuvo un impacto positivo y estadísticamente significativo sobre el margen económico. Esta distinción es clave para algunas áreas de la organización: los efectos, si existen, se producen en la operación, no en el gobierno corporativo. Más recientemente, en un estudio de 2024 sobre 1.990 empresas japonesas cotizadas encontró un impacto significativamente negativo de la diversidad de género en el directorio sobre el desempeño financiero, especialmente en empresas pequeñas y sectores regulados. En tanto, Noruega, al imponer por ley cuotas de género en directorios en 2006, experimentó una caída en los beneficios operativos sobre activos, atribuida al aumento de costos laborales derivado de menos despidos y mayor empleo relativo. El efecto negativo de corto plazo fue documentado y reconocido incluso por investigadores favorables a la política.\\n\\nY ahora, si enfocamos el tema hacia empresas productivas o de distribución, que tienen gran importancia en nuestro país, el GMROI (margen bruto dividido por la inversión promedio en inventario, es un indicador de eficiencia operacional y de gestión de activos). No mide cultura organizacional ni composición de género. Entonces, para que la diversidad de género impacte el GMROI, requeriría una serie de efectos  causales demostrables: que una mayor diversidad genere mejores decisiones de compra y gestión de inventario y por ende una mayor rotación o mejor margen y nos dé como resultado un mejor GMROI. Esa cadena no ha sido demostrada de manera robusta en la literatura disponible hasta el cierre de esta edición. Lo que sí existe es evidencia indirecta: equipos operativos más heterogéneos podrían reducir errores en la toma de decisiones bajo presión, una menor rotación de personal, reducción de costos de capacitación y una mejor coordinación entre áreas pudiendo mejorar la precisión de los pronósticos de demanda. Pero estos efectos son contingentes, no universales, y dependerían de cómo se gestiona la diversidad, no solo de su presencia.\\n\\nPara finalizar y no seguir aburriendo al lector; si fuéramos dueños o gerentes de empresas, deberíamos hacernos una pregunta simple ante cualquier política de diversidad: ¿nuestra empresa implementa prácticas que genuinamente mejoran la calidad de sus decisiones y la retención de talento, o simplemente estamos “cumpliendo con la norma/cuota”? Esta diferencia no se manifiesta a través del lenguaje utilizado en el reporte de sostenibilidad, está en si los procesos de selección, desarrollo y promoción son realmente meritocráticos. Si lo son, la diversidad puede ser un resultado natural de la excelencia. Si no lo son, ninguna política de cuotas, ninguna “Management Fashions”, ni ningún eslogan sobre \\\"perspectiva de género\\\" moverá el GMROI ni creará valor para el accionista, para el cliente, sus trabajadores o el país.\\n\\nEntonces: Género y GMROI: ¿impacto real o nuevo lenguaje corporativo de moda?... La pregunta sigue abierta.\"}")}catch(e){}location.replace("../../?leer=genero-y-gmroi-impacto-real-o-nuevo-lenguaje-corporativo-de-moda");</script>
