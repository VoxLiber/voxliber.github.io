<main><small>Vox Liber · Columnas de opinión</small><h1>La posverdad no es un accidente</h1><p>Cuando la emoción le gana a los hechos, la democracia pierde su piso común. Un análisis de por qué la desinformación prospera, quién gana con ella y cómo se manifiesta en Chile.</p><a href="../../?leer=la-posverdad-no-es-un-accidente">Leer en Vox Liber</a></main>
